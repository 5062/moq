[package]
name = "kio"
description = "Easy async"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.4.4"
edition = "2024"
rust-version.workspace = true

keywords = ["async", "producer", "consumer", "state", "sync"]
categories = ["asynchronous", "concurrency"]

[features]
# Opt-in `tokio::time::Sleep`, a poll-driven wall-clock wait backed by tokio. Off by
# default so kio stays runtime-free. Enable it when driving `poll_*` functions on tokio.
tokio = ["dep:tokio"]
# Opt-in `trace`, which times the consumer wakes a modification triggers as
# `moq_trace::Wake`s, so moq-net's object traces record them as notify.
trace = ["dep:moq-trace"]

[dependencies]
moq-trace = { workspace = true, optional = true }
smallvec = "1.15"
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
