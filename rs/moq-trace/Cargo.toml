[package]
name = "moq-trace"
description = "LTTng-UST tracing for MoQ relay object and QUIC packet latency."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[package.metadata.cargo-shear]
# These are used by build/codegen.rs, which cargo-shear does not follow from build.rs.
ignored = ["cc", "pkg-config"]

[[bin]]
name = "moq-trace"
path = "src/bin/moq-trace/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:csv",
    "dep:humantime",
    "dep:parse-size",
    "dep:rangemap",
    "dep:serde_json",
    "dep:strip-ansi-escapes",
    "dep:tempfile",
]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
csv = { version = "1.4.0", optional = true }
humantime = { workspace = true, optional = true }
parse-size = { workspace = true, optional = true }
rangemap = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
strip-ansi-escapes = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true

[build-dependencies]
cc.workspace = true
pkg-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
