[package]
name = "moq-trace"
description = "Raw JSONL tracing for MoQ relay object and QUIC packet latency."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
