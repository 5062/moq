[package]
name = "moq-trace"
description = "Raw JSONL tracing for MoQ relay object and QUIC packet latency."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "moq-trace"
path = "src/bin/moq-trace/main.rs"
required-features = ["analyze"]

[features]
analyze = ["dep:anyhow", "dep:clap", "dep:csv"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
csv = { version = "1.4.0", optional = true }
serde = { workspace = true }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
