# Cargo config for traced builds: `cargo build --config rs/trace.toml --features trace`.
#
# Swaps in the transport forks that carry the moq-trace hooks and expose stream
# and connection identity. Patches rewrite Cargo.lock, so `just trace-build`
# restores the committed lockfile afterwards; the fork revisions are pinned here.
#
# The Quinn fork requires quic-trace from crates.io. It must keep the source of
# the workspace's moq-trace dependency, which brings quic-trace with it, so MoQ
# and transport hooks resolve to the one process-global facade.
[patch.crates-io]
quic-trace = { git = "https://github.com/5062/moq-trace", branch = "main" }
quinn = { git = "https://github.com/5062/quinn", rev = "04bdddabd8fe91e049d5334fdb7597604255d9d9" }
quinn-proto = { git = "https://github.com/5062/quinn", rev = "04bdddabd8fe91e049d5334fdb7597604255d9d9" }
web-transport-quinn = { git = "https://github.com/5062/web-transport", rev = "eea76bc39afacc65364dc3cd258d0b7bd98836f7" }
web-transport-trait = { git = "https://github.com/5062/web-transport", rev = "eea76bc39afacc65364dc3cd258d0b7bd98836f7" }
